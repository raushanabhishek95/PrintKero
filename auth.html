<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintKero - Shop Owner Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-between min-h-screen font-sans p-4">

    <div class="flex-grow flex items-center justify-center w-full">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border-t-8 border-blue-600 my-8">
            <h1 class="text-3xl font-extrabold text-gray-800 text-center mb-2">Print<span class="text-blue-600">Kero</span></h1>
            <p id="formTitle" class="text-gray-500 text-center mb-6 font-medium">Shop Owner Login</p>

            <!-- Form -->
            <div id="authForm" class="space-y-4">
                <div id="nameField" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Shop Name</label>
                        <input type="text" id="shopName" placeholder="e.g. Sharma Xerox" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Mobile Number</label>
                        <input type="tel" id="mobileNumber" placeholder="9876543210" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Shop Address</label>
                        <input type="text" id="shopAddress" placeholder="e.g. Main Market, Near SBI Bank" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="shop@email.com" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" placeholder="********" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button id="submitBtn" onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition">Login</button>
            </div>

            <!-- Toggle Switch -->
            <div class="text-center mt-6">
                <p id="toggleText" class="text-sm text-gray-600">Don't have a shop account? <button onclick="toggleMode()" class="text-blue-600 font-bold hover:underline">Register here</button></p>
            </div>

            <!-- Adsterra Banner 300x250 Integrated Inside Portal Box Footer -->
            <div class="mt-6 pt-6 border-t border-slate-100 flex justify-center">
                <script>
                  atOptions = {
                    'key' : 'ad8ac3916fcaa2af97c901d6db9c4f8b',
                    'format' : 'iframe',
                    'height' : 250,
                    'width' : 300,
                    'params' : {}
                  };
                </script>
                <script src="https://www.highperformanceformat.com/ad8ac3916fcaa2af97c901d6db9c4f8b/invoke.js"></script>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nvawscbgdhdxpeuvacaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YXdzY2JnZGhkeHBldXZhY2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzMzOTIsImV4cCI6MjEwMjU0OTM5Mn0.lzie8cZN1clLoF74gSNCNcdk5fIpAO9yZVyeUnwh-sI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('nameField').classList.toggle('hidden', !isSignup);
            document.getElementById('formTitle').innerText = isSignup ? "Create Shop Account" : "Shop Owner Login";
            document.getElementById('submitBtn').innerText = isSignup ? "Register Shop" : "Login";
            document.getElementById('toggleText').innerHTML = isSignup ?
                `Already have an account? <button onclick="toggleMode()" class="text-blue-600 font-bold hover:underline">Login here</button>` :
                `Don't have a shop account? <button onclick="toggleMode()" class="text-blue-600 font-bold hover:underline">Register here</button>`;
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const shopName = document.getElementById('shopName').value.trim();
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const address = document.getElementById('shopAddress').value.trim();

            if (!email || !password || (isSignup && (!shopName || !mobileNumber || !address))) {
                alert("Please fill all fields!");
                return;
            }

            if (isSignup) {
                // Sign Up Logic with Address & Mobile
                const shopSlug = shopName.toLowerCase().replace(/[^a-z0-9]/g, '_') + "_" + Math.floor(100 + Math.random() * 900);
                const { error } = await supabaseClient.from('shops').insert([{
                    shop_name: shopName,
                    email,
                    password,
                    shop_slug: shopSlug,
                    mobile_number: mobileNumber,
                    address: address
                }]);

                if (error) {
                    alert("Registration failed: " + error.message);
                } else {
                    alert("Shop registered successfully! Now please login.");
                    toggleMode();
                }
            } else {
                // Login Logic
                const { data, error } = await supabaseClient
                    .from('shops')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert("Invalid email or password!");
                } else {
                    localStorage.setItem('shopSlug', data.shop_slug);
                    localStorage.setItem('shopName', data.shop_name);
                    window.location.href = `dashboard.html?shop=${data.shop_slug}`;
                }
            }
        }
    </script>

    <!-- Adsterra Social Bar Script -->
    <script src="https://pl30899543.effectivecpmnetwork.com/89/8a/9e/898a9eb770cacc9e77be7b02e6f64f04.js"></script>
</body>
</html>
