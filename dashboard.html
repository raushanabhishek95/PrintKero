<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintKaro | Shop Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></link>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 8s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen font-sans text-slate-800 pb-24">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-2xl font-black tracking-tighter">Print<span class="text-blue-200">Karo</span> <span class="text-xs font-medium text-blue-100 ml-2 uppercase tracking-widest">Dashboard</span></h1>
        <div class="flex items-center gap-3">
            <a href="jukebox.html" class="text-sm font-bold flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-black px-3 py-1.5 rounded-lg transition shadow">
                <i class="fas fa-music"></i> Song
            </a>
            <button onclick="toggleSettingsModal()" class="text-sm font-bold flex items-center gap-1 bg-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-500 transition"><i class="fas fa-cog"></i> Rates</button>
            <button onclick="toggleQRModal()" class="text-sm font-bold flex items-center gap-1 bg-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-500 transition"><i class="fas fa-qrcode"></i> QR</button>
            <button onclick="logoutShop()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">LOGOUT</button>
        </div>
    </nav>

    <!-- QR Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center relative shadow-2xl">
            <button onclick="toggleQRModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold mb-6">Shop QR Code</h3>
            <div id="qrcode" class="flex justify-center mb-6"></div>
            <button onclick="printQR()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-black transition">Print Counter Standee</button>
        </div>
    </div>

    <!-- Rate Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center relative shadow-2xl">
            <button onclick="toggleSettingsModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-lg font-bold mb-4">Set Per-Page Rates</h3>
            <p class="text-xs text-slate-500 mb-6">Configure how much you charge customers per page.</p>

            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">B&W Rate (₹ per page)</label>
                    <input type="number" id="inputBwRate" step="0.5" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold" value="0.00">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Color Rate (₹ per page)</label>
                    <input type="number" id="inputColorRate" step="0.5" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold" value="0.00">
                </div>
                <button onclick="saveShopRates()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition mt-2">Save Rates</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-bold text-lg"><i class="fas fa-hourglass-half text-amber-500 mr-2"></i> Pending Prints</h2>
                <span id="fileCount" class="text-xs font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-full">0 Orders</span>
            </div>
            <div id="pendingList" class="space-y-4"></div>
        </div>
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
            <h2 class="font-bold text-lg mb-6"><i class="fas fa-check-circle text-emerald-500 mr-2"></i> Printed History</h2>
            <div id="printedList" class="space-y-3"></div>
        </div>
    </main>

    <!-- Persistent Floating Bottom Music Popup -->
    <div id="floatingMusicPlayer" class="fixed bottom-4 right-4 bg-amber-950/95 border-2 border-amber-500/60 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-2xl z-50 flex items-center gap-4 max-w-sm w-full transition-all duration-300">
        <!-- Spinning Vinyl Mini Icon -->
        <div class="w-10 h-10 rounded-full border-2 border-amber-500 bg-black flex items-center justify-center relative shadow-inner">
            <div id="floatingVinyl" class="w-4 h-4 bg-amber-500 rounded-full animate-spin-slow paused"></div>
        </div>

        <div class="flex-grow">
            <p class="text-xs font-bold text-amber-300">🎵 PrintKaro Cyber Beats</p>
            <p id="floatingStatus" class="text-[10px] text-amber-400/80">Player Paused</p>
        </div>

        <!-- Player Controls -->
        <div class="flex items-center gap-2">
            <button onclick="prevTrack()" class="w-8 h-8 bg-amber-900/80 text-amber-200 rounded-full flex items-center justify-center text-xs hover:bg-amber-800 cursor-pointer shadow" title="Previous">⏮</button>
            <button onclick="togglePlay()" id="floatingPlayBtn" class="w-10 h-10 bg-amber-500 text-black font-extrabold rounded-full flex items-center justify-center text-sm hover:bg-amber-400 cursor-pointer shadow-lg">▶</button>
            <button onclick="nextTrack()" class="w-8 h-8 bg-amber-900/80 text-amber-200 rounded-full flex items-center justify-center text-xs hover:bg-amber-800 cursor-pointer shadow" title="Next">⏭</button>
            <button onclick="closeMusicPlayer()" class="w-6 h-6 bg-red-600/90 text-white rounded-full flex items-center justify-center text-xs hover:bg-red-500 ml-1 cursor-pointer shadow" title="Close Popup">✕</button>
        </div>
    </div>

    <!-- Hidden YouTube API Player Container -->
    <div id="youtube-player" class="absolute opacity-0 pointer-events-none w-0 h-0 border-0"></div>

    <!-- Professional Collapsible Footer -->
    <footer class="mt-auto bg-white border-t border-slate-200">
        <div class="max-w-4xl mx-auto p-6 text-center">
            <button onclick="document.getElementById('contactPanel').classList.toggle('hidden')" class="w-full text-sm font-bold text-slate-500 hover:text-blue-600 transition flex justify-center items-center gap-2">
                CONTACT DEVELOPER <i class="fas fa-chevron-down"></i>
            </button>
            <div id="contactPanel" class="hidden mt-6 pt-6 border-t border-slate-100 grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                <a href="https://www.linkedin.com/in/raushanabhishek" target="_blank" class="p-4 bg-slate-50 rounded-2xl hover:bg-blue-50 transition text-blue-600">
                    <i class="fab fa-linkedin text-2xl mb-2"></i><p class="text-xs font-bold">LINKEDIN</p>
                </a>
                <a href="https://wa.me/919508969439" target="_blank" class="p-4 bg-slate-50 rounded-2xl hover:bg-emerald-50 transition text-emerald-600">
                    <i class="fab fa-whatsapp text-2xl mb-2"></i><p class="text-xs font-bold">WHATSAPP</p>
                </a>
                <a href="mailto:raushanabhishek95089@gmail.com" class="p-4 bg-slate-50 rounded-2xl hover:bg-red-50 transition text-red-600">
                    <i class="fas fa-envelope text-2xl mb-2"></i><p class="text-xs font-bold">EMAIL</p>
                </a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT LOGIC -->
    <script>
        const SUPABASE_URL = 'https://nvawscbgdhdxpeuvacaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YXdzY2JnZGhkeHBldXZhY2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzMzOTIsImV4cCI6MjEwMjU0OTM5Mn0.lzie8cZN1clLoF74gSNCNcdk5fIpAO9yZVyeUnwh-sI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let shopSlug = urlParams.get('shop') || localStorage.getItem('shopSlug');

        if (!shopSlug) window.location.href = 'index.html';

        const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        const customerLink = baseUrl + 'upload.html?shop=' + shopSlug;

        window.addEventListener('DOMContentLoaded', () => {
            const isFirstTime = localStorage.getItem('isFirstLogin');
            if (isFirstTime === 'true') {
                localStorage.removeItem('isFirstLogin');
                toggleSettingsModal();
            }
        });

        let qrGenerated = false;
        function toggleQRModal() {
            const modal = document.getElementById('qrModal');
            modal.classList.toggle('hidden');
            if(!qrGenerated && !modal.classList.contains('hidden')) {
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), { text: customerLink, width: 150, height: 150 });
                qrGenerated = true;
            }
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                fetchShopRates();
            }
        }

        async function fetchShopRates() {
            const { data } = await supabaseClient
                .from('shops')
                .select('bw_rate, color_rate')
                .eq('shop_slug', shopSlug)
                .single();
            if (data) {
                if (data.bw_rate !== null) document.getElementById('inputBwRate').value = data.bw_rate;
                if (data.color_rate !== null) document.getElementById('inputColorRate').value = data.color_rate;
            }
        }

        async function saveShopRates() {
            const bwRate = parseFloat(document.getElementById('inputBwRate').value) || 0.00;
            const colorRate = parseFloat(document.getElementById('inputColorRate').value) || 0.00;

            const { error } = await supabaseClient
                .from('shops')
                .update({ bw_rate: bwRate, color_rate: colorRate })
                .eq('shop_slug', shopSlug);

            if (error) {
                alert("Failed to save rates: " + error.message);
            } else {
                alert("Rates updated successfully!");
                toggleSettingsModal();
            }
        }

        function printQR() {
            const googleQRUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(customerLink)}`;
            const rawShopName = localStorage.getItem('shopName') || shopSlug.split('_')[0].toUpperCase();
            const displayShopName = rawShopName.toUpperCase();

            const qrWindow = window.open('', '_blank', 'width=900,height=950');
            qrWindow.document.write(
                '<html><head><title>' + displayShopName + ' PrintKaro QR</title>' +
                '<style>' +
                '@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap");' +
                'body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: "Inter", sans-serif; background: #f1f5f9; -webkit-print-color-adjust: exact; }' +
                '.card { width: 420px; background: #ffffff; border: 3px solid #0f172a; border-radius: 28px; padding: 35px 30px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; overflow: hidden; }' +
                '.badge { background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }' +
                'h1 { color: #0f172a; font-size: 26px; font-weight: 900; margin: 0 0 6px 0; letter-spacing: -0.5px; }' +
                '.subtitle { color: #64748b; font-size: 13px; font-weight: 600; margin-bottom: 24px; }' +
                '.qr-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 20px; padding: 20px; display: inline-block; margin-bottom: 20px; }' +
                '.qr-box img { display: block; width: 200px; height: 200px; }' +
                '.instruction-box { background: #eff6ff; border-radius: 14px; padding: 12px; margin-bottom: 20px; text-align: left; }' +
                '.instruction-box p { margin: 4px 0; font-size: 11px; font-weight: 700; color: #1e40af; display: flex; align-items: center; gap: 8px; }' +
                '.footer-brand { font-size: 12px; font-weight: 800; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; border-top: 1px solid #f1f5f9; padding-top: 15px; }' +
                '.footer-brand span { color: #2563eb; }' +
                '.print-btn { margin-top: 20px; padding: 14px; width: 100%; background: #2563eb; color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(37,99,235,0.4); }' +
                '.print-btn:hover { background: #1d4ed8; }' +
                '@media print { body { background: white; } .print-btn { display: none; } .card { border: 2px solid #000; box-shadow: none; } }' +
                '</style></head><body><div style="text-align: center;"><div class="card">' +
                '<div class="badge">⚡ Instant Wireless Printing</div>' +
                '<h1>' + displayShopName + '</h1>' +
                '<p class="subtitle">Scan QR code with your phone camera to send files instantly</p>' +
                '<div class="qr-box"><img src="' + googleQRUrl + '" alt="Shop QR Code"></div>' +
                '<div class="instruction-box">' +
                '<p>📱 1. Scan QR code using phone camera</p>' +
                '<p>📄 2. Select PDF or Photo & Choose B&W/Color</p>' +
                '<p>🎫 3. Get Token & Show at Counter</p>' +
                '</div>' +
                '<div class="footer-brand">Powered by <span>PrintKaro</span></div>' +
                '</div><button class="print-btn" onclick="window.print()">🖨️ Print Counter Standee</button></div>' +
                '<script>window.onload = function() { setTimeout(function() { window.focus(); }, 500); };<\/script></body></html>'
            );
            qrWindow.document.close();
        }

        function openFileForPrint(fileUrl) {
            const isPdf = fileUrl.toLowerCase().includes('.pdf') || fileUrl.toLowerCase().includes('pdf');
            const printWindow = window.open('', '_blank', 'width=900,height=800');
            if (printWindow) {
                if (isPdf) {
                    printWindow.document.write(
                        '<html><head><title>Print PDF Document</title><style>body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }</style></head>' +
                        '<body><iframe src="' + fileUrl + '" style="width:100%; height:100%; border:none;"></iframe></body></html>'
                    );
                } else {
                    printWindow.document.write(
                        '<html><head><title>Print Image Document</title><style>' +
                        '@page { size: portrait; margin: 0; }' +
                        'body, html { width: 100%; height: 100%; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; background: #fff; overflow: hidden; }' +
                        'img { max-width: 100%; max-height: 92vh; width: auto; height: auto; object-fit: contain; display: block; }' +
                        '</style></head><body><img src="' + fileUrl + '" onload="window.focus(); window.print();" /></body></html>'
                    );
                }
                printWindow.document.close();
            }
        }

        async function markAsPrinted(id, fileUrl, isOneView) {
            openFileForPrint(fileUrl);
            const { error } = await supabaseClient.from('print_jobs').update({ status: 'printed', printed_at: new Date().toISOString() }).eq('id', id);
            if (!error) { fetchPrintJobs(); }
            if (isOneView) {
                setTimeout(async () => {
                    try {
                        const urlObj = new URL(fileUrl);
                        const pathSegments = urlObj.pathname.split('/print_files/');
                        if (pathSegments.length > 1) {
                            const filePath = decodeURIComponent(pathSegments[1]);
                            await supabaseClient.storage.from('print_files').remove([filePath]);
                        }
                    } catch (err) { console.error("Delayed delete exception:", err); }
                }, 5000);
            }
        }

        async function autoCleanOldPrintedJobs() {
            try {
                const fiveMinutesAgo = new Date(new Date().getTime() - (5 * 60 * 1000)).toISOString();
                const { data: oldJobs } = await supabaseClient.from('print_jobs').select('id, file_url').eq('shop_slug', shopSlug).eq('status', 'printed').lt('printed_at', fiveMinutesAgo);
                if (oldJobs && oldJobs.length > 0) {
                    for (const job of oldJobs) {
                        try {
                            const urlObj = new URL(job.file_url);
                            const pathSegments = urlObj.pathname.split('/print_files/');
                            if (pathSegments.length > 1) {
                                const filePath = decodeURIComponent(pathSegments[1]);
                                await supabaseClient.storage.from('print_files').remove([filePath]);
                            }
                        } catch (err) { console.error("Storage delete error:", err); }
                    }
                    await supabaseClient.from('print_jobs').delete().eq('shop_slug', shopSlug).eq('status', 'printed').lt('printed_at', fiveMinutesAgo);
                }
            } catch (e) { console.error("Auto clean error:", e); }
        }

        async function fetchPrintJobs() {
            await autoCleanOldPrintedJobs();
            const { data } = await supabaseClient.from('print_jobs').select('*').eq('shop_slug', shopSlug).order('id', { ascending: false });
            const pList = document.getElementById('pendingList'), hList = document.getElementById('printedList');
            pList.innerHTML = ""; hList.innerHTML = "";
            if(data) {
                const tokenTotals = {};
                data.forEach(j => {
                    if (!tokenTotals[j.token_number]) { tokenTotals[j.token_number] = { totalAmount: 0, totalFiles: 0, totalPages: 0 }; }
                    tokenTotals[j.token_number].totalAmount += (j.total_price || 0);
                    tokenTotals[j.token_number].totalFiles += 1;
                    tokenTotals[j.token_number].totalPages += (j.total_pages || 1);
                });
                const pendingJobs = data.filter(j => j.status !== 'printed');
                const printedJobs = data.filter(j => j.status === 'printed');
                const tokenGroups = {};
                pendingJobs.forEach(j => { if (!tokenGroups[j.token_number]) { tokenGroups[j.token_number] = []; } tokenGroups[j.token_number].push(j); });
                const printedTokenGroups = {};
                printedJobs.forEach(j => { if (!printedTokenGroups[j.token_number]) { printedTokenGroups[j.token_number] = []; } printedTokenGroups[j.token_number].push(j); });

                Object.keys(tokenGroups).forEach(token => {
                    const groupJobs = tokenGroups[token];
                    const fixedTotalAmount = tokenTotals[token].totalAmount;
                    const totalFilesCount = tokenTotals[token].totalFiles;
                    const totalPagesCount = tokenTotals[token].totalPages;
                    let fileItemsHtml = "";
                    groupJobs.forEach(j => {
                        const typeBadge = (j.print_type === 'color') ? '<span class="text-[9px] font-bold bg-pink-100 text-pink-700 px-2 py-0.5 rounded ml-1">Color</span>' : '<span class="text-[9px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded ml-1">B&W</span>';
                        const oneViewBadge = j.is_one_view ? '<span class="text-[9px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded ml-1">One View</span>' : '';
                        fileItemsHtml += `<div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-none gap-2"><div class="truncate pr-2"><p class="font-bold text-xs text-slate-700 truncate">${j.file_name.substring(14)}</p><div class="flex items-center gap-1 mt-0.5">${typeBadge}${oneViewBadge} <span class="text-[10px] text-slate-400">• ${j.total_pages || 1} Pages (₹${(j.total_price || 0).toFixed(2)})</span></div></div><button onclick="markAsPrinted(${j.id}, '${j.file_url}', ${j.is_one_view})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold whitespace-nowrap transition shadow-sm">PRINT</button></div>`;
                    });
                    pList.innerHTML += `<div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3"><div class="flex justify-between items-center pb-2 border-b border-slate-200"><span class="text-xs font-black bg-blue-600 text-white px-2.5 py-1 rounded-lg">TOKEN ${token}</span><div class="text-right"><span class="text-xs font-bold text-slate-500 block">${totalFilesCount} Files (${totalPagesCount} Pages)</span><span class="text-sm font-black text-emerald-600">Total Bill: ₹${fixedTotalAmount.toFixed(2)}</span></div></div><div class="space-y-1">${fileItemsHtml}</div></div>`;
                });

                Object.keys(printedTokenGroups).forEach(token => {
                    const groupJobs = printedTokenGroups[token];
                    const fixedTotalAmount = tokenTotals[token].totalAmount;
                    const totalFilesCount = tokenTotals[token].totalFiles;
                    let fileItemsHtml = "";
                    groupJobs.forEach(j => {
                        const typeBadge = (j.print_type === 'color') ? '<span class="text-[9px] font-bold bg-pink-100 text-pink-700 px-2 py-0.5 rounded ml-1">Color</span>' : '<span class="text-[9px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded ml-1">B&W</span>';
                        const oneViewBadge = j.is_one_view ? '<span class="text-[9px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded ml-1">One View</span>' : '';
                        let reprintBtn = !j.is_one_view ? `<button onclick="openFileForPrint('${j.file_url}')" class="text-[10px] font-bold text-blue-600 hover:underline">Reprint</button>` : '<span class="text-[10px] text-slate-400">Expired</span>';
                        fileItemsHtml += `<div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-none text-xs"><div class="truncate pr-2"><span class="font-medium text-slate-700 truncate">${j.file_name.substring(14)}</span><div class="flex items-center gap-1">${typeBadge}${oneViewBadge} <span class="text-[10px] text-slate-400">₹${(j.total_price || 0).toFixed(2)}</span></div></div><div>${reprintBtn}</div></div>`;
                    });
                    hList.innerHTML += `<div class="p-4 bg-emerald-50/50 rounded-2xl border border-emerald-100 space-y-2"><div class="flex justify-between items-center pb-2 border-b border-emerald-100"><span class="text-xs font-black bg-emerald-600 text-white px-2.5 py-1 rounded-lg">TOKEN ${token}</span><div class="text-right"><span class="text-xs font-bold text-slate-600 block">${totalFilesCount} Files Printed</span><span class="text-sm font-black text-emerald-700">Total: ₹${fixedTotalAmount.toFixed(2)}</span></div></div><div class="space-y-1">${fileItemsHtml}</div></div>`;
                });
                document.getElementById('fileCount').innerText = Object.keys(tokenGroups).length + ' Orders';
            }
        }

        // YouTube Iframe Player API Integration for Dashboard Floating Player
        let player;
        let isPlaying = false;
        const playlistId = "RDATli";

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    'listType': 'playlist',
                    'list': playlistId,
                    'autoplay': 0,
                    'shuffle': 1,
                    'enablejsapi': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const playBtn = document.getElementById('floatingPlayBtn');
            const statusText = document.getElementById('floatingStatus');
            const floatingVinyl = document.getElementById('floatingVinyl');

            if (event.data == YT.PlayerState.PLAYING) {
                playBtn.innerText = "⏸";
                statusText.innerText = "Playing Retro Beats...";
                floatingVinyl.classList.remove('paused');
                isPlaying = true;
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                playBtn.innerText = "▶";
                statusText.innerText = "Player Paused";
                floatingVinyl.classList.add('paused');
                isPlaying = false;
            }
        }

        function togglePlay() {
            if (!player) return;
            const statusText = document.getElementById('floatingStatus');
            if (!isPlaying) {
                statusText.innerText = "Loading...";
                player.playVideo();
            } else {
                player.pauseVideo();
            }
        }

        function nextTrack() {
            if (player && typeof player.nextVideo === 'function') {
                const statusText = document.getElementById('floatingStatus');
                statusText.innerText = "Switching Track...";
                player.nextVideo();
                setTimeout(() => {
                    statusText.innerText = "Playing Retro Beats...";
                }, 800);
            }
        }

        function prevTrack() {
            if (player && typeof player.previousVideo === 'function') {
                const statusText = document.getElementById('floatingStatus');
                statusText.innerText = "Switching Track...";
                player.previousVideo();
                setTimeout(() => {
                    statusText.innerText = "Playing Retro Beats...";
                }, 800);
            }
        }

        function closeMusicPlayer() {
            const playerBar = document.getElementById('floatingMusicPlayer');
            if (player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            playerBar.style.display = 'none';
            isPlaying = false;
        }

        function logoutShop() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        fetchPrintJobs();
        setInterval(fetchPrintJobs, 5000);
    </script>
</body>
</html>
