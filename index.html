<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintKero | Upload & Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PDF.js library for accurate page counting -->

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

</head>
<body class="bg-slate-50 flex flex-col min-h-screen font-sans text-slate-800">

    <!-- Main Upload Section -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border-t-8 border-blue-600">
            <h1 class="text-4xl font-black tracking-tighter text-slate-900 mb-2">Print<span class="text-blue-600">Kero</span></h1>
            <p id="shopSubTitle" class="text-slate-500 mb-6 text-sm font-medium">Fast, secure, and instant wireless printing.</p>

            <!-- Upload Box -->
            <div id="uploadUI">
                <input type="file" id="fileInput" class="hidden" accept=".pdf,.jpg,.jpeg,.png" multiple>
                <div id="dropZone" onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-blue-300 rounded-2xl p-6 hover:bg-blue-50/50 cursor-pointer transition group">
                    <i class="fas fa-cloud-upload-alt text-4xl text-blue-500 mb-2 group-hover:scale-110 transition"></i>
                    <h3 id="fileLabel" class="text-sm font-bold text-slate-700">Tap to Select Files (Multiple allowed)</h3>
                    <p class="text-xs text-slate-400 mt-1">Supports PDF, JPG, PNG</p>
                </div>

                <!-- Selected Files Preview Box -->
                <div id="selectedFilesContainer" class="hidden mt-4 text-left max-h-36 overflow-y-auto space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200"></div>

                <!-- Print Type Selection (B&W or Color) -->
                <div class="mt-4 grid grid-cols-2 gap-3 text-left">
                    <label class="cursor-pointer">
                        <input type="radio" name="printType" value="bw" checked class="peer hidden">
                        <div class="p-3 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50/50 transition text-center">
                            <span class="block text-xs font-bold text-slate-700 peer-checked:text-blue-600"><i class="fas fa-print mr-1"></i> B&W</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="printType" value="color" class="peer hidden">
                        <div class="p-3 bg-slate-50 border-2 border-slate-200 rounded-xl peer-checked:border-blue-600 peer-checked:bg-blue-50/50 transition text-center">
                            <span class="block text-xs font-bold text-slate-700 peer-checked:text-blue-600"><i class="fas fa-palette mr-1"></i> Color</span>
                        </div>
                    </label>
                </div>

                <!-- One View Checkbox Option -->
                <div class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center gap-3 text-left">
                    <input type="checkbox" id="oneViewCheck" class="w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                    <label for="oneViewCheck" class="text-xs text-slate-700 cursor-pointer select-none">
                        <span class="font-bold block text-slate-900"><i class="fas fa-eye-slash text-blue-500 mr-1"></i> Send as "One View"</span>
                        Deletes automatically after single print session.
                    </label>
                </div>

                <button id="uploadBtn" onclick="uploadFiles()" class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">Upload & Get Token</button>
            </div>

            <!-- Token Display Area (Success State) -->
            <div id="tokenDisplay" class="hidden mt-4">
                <div class="p-6 bg-emerald-50 border border-emerald-200 rounded-2xl">
                    <p class="text-emerald-800 font-bold text-xs uppercase tracking-wider">Your Print Token</p>
                    <h2 id="tokenNumber" class="text-5xl font-black text-emerald-600 my-3">--</h2>
                    <p id="priceSummary" class="text-xs font-bold text-emerald-800 mt-1">Total Estimated Price: ₹0.00</p>
                    <p class="text-xs text-emerald-700 font-medium mt-1">Show this token at the counter</p>
                </div>

                <!-- Adsterra Banner 300x250 Integrated Here -->
                <div class="my-4 flex justify-center">
                    <script type="text/javascript">
                        atOptions = {
                            'key' : '2a7f8caa2a02bb3f31008ff6f3cc64fe',
                            'format' : 'iframe',
                            'height' : 250,
                            'width' : 300,
                            'params' : {}
                        };
                    </script>
                    <script type="text/javascript" src="https://www.highperformanceformat.com/2a7f8caa2a02bb3f31008ff6f3cc64fe/invoke.js"></script>
                </div>

                <button onclick="resetUpload()" class="mt-2 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition text-sm">
                    <i class="fas fa-redo mr-2"></i> Upload Another File
                </button>
            </div>
        </div>
    </main>

    <!-- Professional Collapsible Footer -->
    <footer class="mt-auto bg-white border-t border-slate-200">
        <div class="max-w-4xl mx-auto p-6 text-center">
            <button onclick="document.getElementById('contactPanel').classList.toggle('hidden')" class="text-xs font-bold text-slate-500 hover:text-blue-600 transition flex justify-center items-center gap-2 mx-auto">
                CONTACT DEVELOPER <i class="fas fa-chevron-down"></i>
            </button>
            <div id="contactPanel" class="hidden mt-6 pt-6 border-t border-slate-100 grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                <a href="https://www.linkedin.com/in/raushanabhishek" target="_blank" class="p-4 bg-slate-50 rounded-2xl hover:bg-blue-50 transition text-blue-600">
                    <i class="fab fa-linkedin text-2xl mb-2"></i><p class="text-xs font-bold">LINKEDIN</p>
                </a>
                <a href="https://wa.me/919508969439" target="_blank" class="p-4 bg-slate-50 rounded-2xl hover:bg-emerald-50 transition text-emerald-600">
                    <i class="fab fa-whatsapp text-2xl mb-2"></i><p class="text-xs font-bold">WHATSAPP</p>
                </a>
                <a href="mailto:raushanabhishek95089@gmail.com" class="p-4 bg-slate-50 rounded-2xl hover:bg-red-50 transition text-red-600">
                    <i class="fas fa-envelope text-2xl mb-2"></i><p class="text-xs font-bold">EMAIL</p>
                </a>
            </div>
        </div>
    </footer>

    <!-- Customer Upload Logic -->
    <script>
        const SUPABASE_URL = 'https://nvawscbgdhdxpeuvacaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YXdzY2JnZGhkeHBldXZhY2FhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzMzOTIsImV4cCI6MjEwMjU0OTM5Mn0.lzie8cZN1clLoF74gSNCNcdk5fIpAO9yZVyeUnwh-sI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const shopSlug = urlParams.get('shop');

        if (!shopSlug) {
            alert("Invalid shop link! Please scan a valid shop QR code.");
        } else {
            document.getElementById('shopSubTitle').innerText = `Printing for Shop: ${shopSlug.split('_')[0].toUpperCase()}`;
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            const container = document.getElementById('selectedFilesContainer');
            container.innerHTML = "";

            if(files.length > 0) {
                container.classList.remove('hidden');
                if(files.length === 1) {
                    document.getElementById('fileLabel').innerText = files[0].name;
                } else {
                    document.getElementById('fileLabel').innerText = `${files.length} files selected`;
                }
                document.getElementById('fileLabel').classList.add('text-blue-600');

                for(let i=0; i<files.length; i++) {
                    container.innerHTML += `<div class="flex items-center justify-between text-xs bg-white p-2 rounded-lg border border-slate-100">
                        <span class="font-bold text-slate-700 truncate max-w-[220px]"><i class="fas fa-file-alt text-blue-500 mr-1"></i> ${files[i].name}</span>
                        <span class="text-slate-400 text-[10px]">${(files[i].size / 1024).toFixed(1)} KB</span>
                    </div>`;
                }
            } else {
                container.classList.add('hidden');
                document.getElementById('fileLabel').innerText = "Tap to Select Files (Multiple allowed)";
                document.getElementById('fileLabel').classList.remove('text-blue-600');
            }
        });

        function resetUpload() {
            document.getElementById('fileInput').value = "";
            document.getElementById('oneViewCheck').checked = false;
            document.querySelector('input[name="printType"][value="bw"]').checked = true;
            document.getElementById('tokenDisplay').classList.add('hidden');
            document.getElementById('uploadUI').classList.remove('hidden');
            document.getElementById('selectedFilesContainer').classList.add('hidden');
            document.getElementById('selectedFilesContainer').innerHTML = "";
            document.getElementById('fileLabel').innerText = "Tap to Select Files (Multiple allowed)";
            document.getElementById('fileLabel').classList.remove('text-blue-600');
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('uploadBtn').innerText = "Upload & Get Token";
        }

        async function getPdfPageCount(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                return pdf.numPages;
            } catch (error) {
                console.error("Error reading PDF pages:", error);
                return 1;
            }
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const isOneView = document.getElementById('oneViewCheck').checked;
            const printType = document.querySelector('input[name="printType"]:checked').value;

            if (!shopSlug) return alert("Invalid shop reference!");
            if (!fileInput.files || fileInput.files.length === 0) return alert("Please select at least one file first!");

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;

            try {
                let bwRate = 2.00;
                let colorRate = 10.00;

                const { data: shopData } = await supabaseClient
                    .from('shops')
                    .select('bw_rate, color_rate')
                    .eq('shop_slug', shopSlug)
                    .single();

                if (shopData) {
                    if (shopData.bw_rate !== null) bwRate = parseFloat(shopData.bw_rate);
                    if (shopData.color_rate !== null) colorRate = parseFloat(shopData.color_rate);
                }

                const token = "#" + Math.floor(1000 + Math.random() * 9000);
                const files = fileInput.files;
                let grandTotalPrice = 0;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    let filePages = 1;

                    if (file.type === "application/pdf" || file.name.toLowerCase().endsWith('.pdf')) {
                        btn.innerText = `Reading PDF (${i+1}/${files.length})...`;
                        filePages = await getPdfPageCount(file);
                    } else {
                        filePages = 1;
                    }

                    const ratePerUnit = (printType === 'color') ? colorRate : bwRate;
                    const filePrice = filePages * ratePerUnit;
                    grandTotalPrice += filePrice;

                    const cleanName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    const fileName = Date.now() + "_" + cleanName;

                    btn.innerText = `Uploading (${i+1}/${files.length})...`;

                    // Fixed back to lowercase 'print_files' bucket matching Supabase dashboard
                    const { error: uploadError } = await supabaseClient.storage.from('print_files').upload(fileName, file);
                    if (uploadError) throw new Error("Storage upload failed: " + uploadError.message);

                    const { data: urlData } = supabaseClient.storage.from('print_files').getPublicUrl(fileName);

                    const { error: dbError } = await supabaseClient.from('print_jobs').insert([{
                        token_number: token,
                        file_name: fileName,
                        file_url: urlData.publicUrl,
                        shop_slug: shopSlug,
                        is_one_view: isOneView,
                        print_type: printType,
                        total_pages: filePages,
                        total_price: filePrice
                    }]);

                    if (dbError) throw new Error("Database insert failed: " + dbError.message);
                }

                document.getElementById('uploadUI').classList.add('hidden');
                document.getElementById('tokenDisplay').classList.remove('hidden');
                document.getElementById('tokenNumber').innerText = token;
                document.getElementById('priceSummary').innerText = `Total Estimated Price: ₹${grandTotalPrice.toFixed(2)}`;
            } catch (err) {
                alert("Upload failed! Error: " + err.message);
                btn.innerText = "Upload & Get Token";
                btn.disabled = false;
            }
        }
    </script>
